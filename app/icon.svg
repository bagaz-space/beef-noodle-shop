<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <!--
    Favicon. The lounging cow from public/character/lounge.svg, knocked out of
    a solid red square instead of drawn as red line art on nothing.

    The client picked this character; the inversion is what makes it survive.
    As-is it is thin outline work with a lot of interior detail, and at the
    16px a browser tab actually renders it reads as a faint scribble — and
    close to invisible on a dark-themed tab, dark red on near-black. A filled
    square gives it mass at any size, on any tab colour.

    Square corners, not rounded: it matches the red square lock-up in the
    client's own end card, and the site is hard-edged by design
    (docs/02-desain.md, "yang sengaja tidak dipakai").

    Colours are literal here rather than tokens. This file is served on its
    own by the browser, outside the page, so it can't see globals.css:
    #a50a0a is --character, #f4ede1 is --ground.
  -->
  <rect width="500" height="500" fill="#a50a0a"/>
